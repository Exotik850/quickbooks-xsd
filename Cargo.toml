[package]
name = "quickbooks-xsd"
version = "3.75.0"
edition = "2024"
authors = ["@Exotik850"]
description = "XSD Types for the Quickbooks QBO API generated for Rust"
repository = "https://github.com/exotik850/quickbooks-xsd"
license = "MIT"
readme = "README.md"
exclude = ["extracted/"]

[dependencies]
xsd-parser-types = { version = "0.2", features = [
  "quick-xml",
], path = "../xsd-parser/xsd-parser-types" }

[build-dependencies]
zip = { version = "8.6", optional = true }
ureq = { version = "3.3", optional = true }
xsd-parser = { optional = true, path = "../xsd-parser/xsd-parser" }

[features]
generate = ["zip", "ureq", "xsd-parser"]

[[example]]
name = "xml"
path = "examples/xml.rs"
